name: Release CLI Pipeline
on:
  push:
    branches:
      - main
      - alpha
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Must match the Environment on npm's trusted publisher for this package
    environment: prod
    # Prevent the app's own release commit from re-triggering this workflow
    if: github.actor != 'stallion-release-bot[bot]'
    # id-token: write mints the OIDC token npm's trusted publisher verifies
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js and enable Corepack
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          # v5 auto-caches from package.json's packageManager field, which runs
          # before corepack installs pnpm below. The pnpm store is cached
          # explicitly in the next step anyway.
          package-manager-cache: false

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup git user
        run: |
          git config --global user.name "${{ secrets.GH_DEPLOY_NAME }}"
          git config --global user.email "${{ secrets.GH_DEPLOY_EMAIL }}"

      - name: Build and prepare release
        run: pnpm install --frozen-lockfile && pnpm prepare-release

      # Publishes to npm via trusted publishing, so no NPM_TOKEN is needed.
      # npm binds the trusted publisher to this workflow's file name: renaming
      # publish-pkg.yml means updating the publisher on npmjs.com too.
      - name: Release package
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GH_DEPLOY_EMAIL }}
          GIT_AUTHOR_NAME: ${{ secrets.GH_DEPLOY_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GH_DEPLOY_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.GH_DEPLOY_NAME }}
          DEBUG: semantic-release:*